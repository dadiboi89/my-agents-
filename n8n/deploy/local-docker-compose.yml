# 100% free local n8n — runs on your own computer with Docker Desktop.
# Tunnel-agnostic: works with Cloudflare Quick Tunnel (zero signup, recommended),
# ngrok, Tailscale Funnel, or anything else that gives you a public HTTPS URL
# pointing at this container's port 5678.
#
# Setup:
#   1. Get a public HTTPS URL for localhost:5678 (see n8n/DEPLOY.md Path 0 —
#      Cloudflare Quick Tunnel needs literally zero signup).
#   2. Copy .env.example to .env in this same folder and set PUBLIC_HOST to
#      just the hostname (no https://, no trailing slash), e.g.
#      random-words.trycloudflare.com
#   3. docker compose -f local-docker-compose.yml up -d
#   4. Open https://PUBLIC_HOST and create the owner account.
#
# Data persists in the n8n_data volume across restarts. If your tunnel URL
# changes (quick tunnels are ephemeral — a new one is issued on every
# restart), update .env and run `docker compose -f local-docker-compose.yml up -d`
# again to pick it up.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_SECURE_COOKIE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - GENERIC_TIMEZONE=Europe/Rome
      - N8N_HOST=${PUBLIC_HOST}
      - WEBHOOK_URL=https://${PUBLIC_HOST}/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
